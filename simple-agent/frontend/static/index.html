<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Travel Concierge</title>
<!-- Google Fonts & Icons -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0">
<style>
  :root {
    --accent: #0f766e;
    --accent-light: #0d9488;
    --accent-gradient: linear-gradient(135deg, #0f766e 0%, #115e59 100%);
    --bg: #f8fafc;
    --card-bg: #ffffff;
    --border: #e2e8f0;
    --text-primary: #0f172a;
    --text-secondary: #64748b;
    --user-bubble: linear-gradient(135deg, #0f766e 0%, #0d9488 100%);
    --shadow-sm: 0 1px 3px rgba(0,0,0,0.05);
    --shadow-md: 0 4px 6px -1px rgba(15, 118, 110, 0.08), 0 2px 4px -2px rgba(0,0,0,0.05);
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
    background: var(--bg);
    color: var(--text-primary);
    display: flex;
    flex-direction: column;
    height: 100vh;
    overflow: hidden;
  }

  /* Header */
  header {
    background: var(--card-bg);
    border-bottom: 1px solid var(--border);
    padding: 0.9rem 1.5rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
    box-shadow: var(--shadow-sm);
    z-index: 10;
  }
  .header-brand {
    display: flex;
    align-items: center;
    gap: 0.75rem;
  }
  .brand-icon {
    width: 38px;
    height: 38px;
    border-radius: 10px;
    background: var(--accent-gradient);
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.3rem;
    box-shadow: 0 2px 5px rgba(15, 118, 110, 0.25);
  }
  .brand-text {
    display: flex;
    flex-direction: column;
  }
  .brand-title {
    font-weight: 700;
    font-size: 1.1rem;
    letter-spacing: -0.01em;
    color: var(--text-primary);
  }
  .brand-subtitle {
    font-size: 0.75rem;
    color: var(--text-secondary);
    font-weight: 500;
  }
  .status-badge {
    display: inline-flex;
    align-items: center;
    gap: 0.4rem;
    padding: 0.3rem 0.75rem;
    background: #f0fdf4;
    border: 1px solid #bbf7d0;
    color: #166534;
    border-radius: 20px;
    font-size: 0.75rem;
    font-weight: 600;
  }
  .status-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: #22c55e;
    animation: pulse 2s infinite;
  }

  @keyframes pulse {
    0% { transform: scale(0.95); opacity: 0.8; }
    50% { transform: scale(1.15); opacity: 1; }
    100% { transform: scale(0.95); opacity: 0.8; }
  }

  /* Chat Log Area */
  #log {
    flex: 1;
    overflow-y: auto;
    padding: 1.5rem 1rem;
    max-width: 860px;
    width: 100%;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    gap: 1.25rem;
  }

  /* Dialogue Message Rows */
  .msg {
    display: flex;
    gap: 0.75rem;
    max-width: 88%;
    animation: fadeIn 0.25s ease-out forwards;
  }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .msg.user {
    align-self: flex-end;
    flex-direction: row-reverse;
  }
  .msg.agent {
    align-self: flex-start;
  }

  .avatar {
    width: 34px;
    height: 34px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.75rem;
    font-weight: 700;
    flex-shrink: 0;
  }
  .msg.agent .avatar {
    background: var(--accent-gradient);
    color: #fff;
    box-shadow: 0 2px 4px rgba(15, 118, 110, 0.2);
  }
  .msg.user .avatar {
    background: #e2e8f0;
    color: var(--text-secondary);
  }

  .msg-content {
    display: flex;
    flex-direction: column;
    gap: 0.25rem;
  }
  .sender-name {
    font-size: 0.7rem;
    font-weight: 600;
    color: var(--text-secondary);
    margin-left: 0.2rem;
  }
  .msg.user .sender-name {
    text-align: right;
    margin-right: 0.2rem;
  }

  .bubble {
    padding: 0.8rem 1.1rem;
    border-radius: 16px;
    background: var(--card-bg);
    border: 1px solid var(--border);
    font-size: 0.95rem;
    line-height: 1.5;
    box-shadow: var(--shadow-sm);
    color: var(--text-primary);
    white-space: pre-wrap;
    word-break: break-word;
  }
  .msg.agent .bubble {
    border-top-left-radius: 4px;
  }
  .msg.user .bubble {
    background: var(--user-bubble);
    color: #ffffff;
    border: none;
    border-top-right-radius: 4px;
    box-shadow: 0 3px 8px rgba(15, 118, 110, 0.2);
  }

  /* Rich A2UI Card Wrapper */
  .bubble.rich {
    background: transparent;
    border: none;
    padding: 0;
    box-shadow: none;
    max-width: 100%;
    white-space: normal;
  }

  /* --- A2UI Component Styling --- */
  .a2card {
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 1.1rem;
    background: var(--card-bg);
    box-shadow: var(--shadow-md);
    max-width: 100%;
  }
  .a2card + .a2card, .a2col > .a2card { margin-top: 0.75rem; }
  .a2col { display: flex; flex-direction: column; gap: 0.5rem; }
  .a2row { display: flex; flex-direction: row; gap: 0.75rem; align-items: center; flex-wrap: wrap; }
  .a2row.between { justify-content: space-between; }
  .a2text { margin: 0; line-height: 1.45; }
  .a2text.a2-h1 { font-size: 1.4rem; font-weight: 700; color: var(--accent); }
  .a2text.a2-h2 { font-size: 1.2rem; font-weight: 700; color: var(--text-primary); }
  .a2text.a2-h3 { font-size: 1.05rem; font-weight: 600; color: var(--accent); }
  .a2text.a2-h4 { font-size: 0.95rem; font-weight: 600; }
  .a2text.a2-caption { font-size: 0.8rem; color: var(--text-secondary); }
  .a2divider { border: none; border-top: 1px solid var(--border); margin: 0.5rem 0; width: 100%; }
  .a2img { max-width: 100%; border-radius: 10px; display: block; margin-top: 0.4rem; box-shadow: var(--shadow-sm); }
  .material-symbols-outlined { font-family: 'Material Symbols Outlined'; font-size: 1.2rem; vertical-align: middle; color: var(--accent); }

  /* Bottom Controls & Chips */
  .bottom-container {
    background: var(--card-bg);
    border-top: 1px solid var(--border);
    padding: 0.75rem 1rem 1rem;
    max-width: 860px;
    width: 100%;
    margin: 0 auto;
  }
  .example-chips {
    display: flex;
    gap: 0.5rem;
    padding-bottom: 0.75rem;
    flex-wrap: wrap;
    justify-content: center;
  }
  .chip {
    padding: 0.45rem 0.9rem;
    border: 1px solid var(--border);
    border-radius: 20px;
    background: var(--bg);
    color: var(--text-primary);
    font-size: 0.825rem;
    font-weight: 500;
    cursor: pointer;
    font-family: inherit;
    transition: all 0.2s ease;
    display: inline-flex;
    align-items: center;
    gap: 0.35rem;
  }
  .chip:hover {
    background: var(--accent);
    color: #ffffff;
    border-color: var(--accent);
    transform: translateY(-1px);
    box-shadow: 0 2px 6px rgba(15, 118, 110, 0.2);
  }

  form {
    display: flex;
    gap: 0.6rem;
  }
  input {
    flex: 1;
    padding: 0.85rem 1.1rem;
    border: 1px solid var(--border);
    border-radius: 24px;
    font-size: 0.95rem;
    font-family: inherit;
    background: var(--bg);
    color: var(--text-primary);
    outline: none;
    transition: border-color 0.2s ease, box-shadow 0.2s ease;
  }
  input:focus {
    border-color: var(--accent);
    background: #ffffff;
    box-shadow: 0 0 0 3px rgba(15, 118, 110, 0.12);
  }
  button {
    padding: 0.85rem 1.4rem;
    border: none;
    border-radius: 24px;
    background: var(--accent-gradient);
    color: #ffffff;
    font-weight: 600;
    font-family: inherit;
    cursor: pointer;
    transition: all 0.2s ease;
    box-shadow: 0 2px 5px rgba(15, 118, 110, 0.25);
    display: flex;
    align-items: center;
    gap: 0.35rem;
  }
  button:hover {
    opacity: 0.95;
    transform: translateY(-1px);
    box-shadow: 0 4px 8px rgba(15, 118, 110, 0.3);
  }
</style>
</head>
<body>

<header>
  <div class="header-brand">
    <div class="brand-icon">
      <span class="material-symbols-outlined">explore</span>
    </div>
    <div class="brand-text">
      <span class="brand-title">Travel Concierge</span>
      <span class="brand-subtitle">Bespoke Luxury Travel Assistant</span>
    </div>
  </div>
  <div class="status-badge">
    <span class="status-dot"></span>
    <span>Agent Active</span>
  </div>
</header>

<div id="log"></div>

<div class="bottom-container">
  <div class="example-chips" id="chips">
    <button type="button" class="chip" data-prompt="Search luxury destinations in Paris">
      <span class="material-symbols-outlined" style="font-size: 1rem; color: inherit;">search</span> Explore Paris
    </button>
    <button type="button" class="chip" data-prompt="Calculate budget for 500 USD in EUR">
      <span class="material-symbols-outlined" style="font-size: 1rem; color: inherit;">payments</span> Convert 500 USD to EUR
    </button>
    <button type="button" class="chip" data-prompt="Generate an image of a luxury overwater villa in Bora Bora">
      <span class="material-symbols-outlined" style="font-size: 1rem; color: inherit;">image</span> Bora Bora Villa Image
    </button>
  </div>

  <form id="form">
    <input id="input" placeholder="Ask about luxury destinations, itineraries, or visuals..." autocomplete="off" autofocus>
    <button type="submit">
      <span>Send</span>
      <span class="material-symbols-outlined" style="font-size: 1.1rem; color: #fff;">send</span>
    </button>
  </form>
</div>

<script>
const log = document.getElementById("log");
const form = document.getElementById("form");
const input = document.getElementById("input");

function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }

function bubble(who) {
  const m = el("div", "msg " + who);
  const avatar = el("div", "avatar", who === "user" ? "YOU" : "AI");
  if (who === "agent") {
    avatar.innerHTML = '<span class="material-symbols-outlined" style="font-size:1.1rem; color:#fff;">smart_toy</span>';
  }
  const contentWrapper = el("div", "msg-content");
  const nameLabel = el("div", "sender-name", who === "user" ? "You" : "Travel Concierge");
  const b = el("div", "bubble");

  contentWrapper.appendChild(nameLabel);
  contentWrapper.appendChild(b);

  if (who === "user") {
    m.appendChild(contentWrapper);
    m.appendChild(avatar);
  } else {
    m.appendChild(avatar);
    m.appendChild(contentWrapper);
  }

  log.appendChild(m);
  log.scrollTop = log.scrollHeight;
  return b;
}

/* ----------------------------------------------------------------------------
 * A2UI mini-renderer (v0.8 Basic Catalog subset).
 * Renders Card / Column / Row / Text / Divider / List / Image / Icon.
 * Anything else falls back to plain text (see renderReply). All text goes in via
 * textContent and image URLs are validated, so agent output can't inject HTML.
 * -------------------------------------------------------------------------- */

function boundStr(v) {
  if (v == null) return "";
  if (typeof v === "string") return v;
  if (typeof v.literalString === "string") return v.literalString;
  return "";
}

function childIds(props) {
  const ids = [];
  if (props && typeof props.child === "string") ids.push(props.child);
  const ch = props && props.children;
  if (ch && Array.isArray(ch.explicitList)) for (const c of ch.explicitList) if (typeof c === "string") ids.push(c);
  return ids;
}

function iconName(n) { return String(n || "").replace(/([a-z0-9])([A-Z])/g, "$1_$2").replace(/\s+/g, "_").toLowerCase(); }

function buildNode(id, comps, seen) {
  if (!id || seen.has(id)) return null;
  seen.add(id);
  const spec = comps[id];
  if (!spec || typeof spec !== "object") return null;
  const type = Object.keys(spec)[0];
  const props = spec[type] || {};
  const kids = () => childIds(props).map(cid => buildNode(cid, comps, seen)).filter(Boolean);

  switch (type) {
    case "Card": {
      const d = el("div", "a2card"); kids().forEach(n => d.appendChild(n)); return d;
    }
    case "Column":
    case "List": {
      const horizontal = type === "List" && props.direction === "horizontal";
      const d = el("div", horizontal ? "a2row" : "a2col"); kids().forEach(n => d.appendChild(n)); return d;
    }
    case "Row": {
      const d = el("div", "a2row" + (props.distribution === "spaceBetween" ? " between" : ""));
      kids().forEach(n => d.appendChild(n)); return d;
    }
    case "Text": {
      const t = el("div", "a2text");
      const hint = String(props.usageHint || "body").toLowerCase();
      if (["h1", "h2", "h3", "h4", "h5", "h6"].includes(hint)) t.classList.add("a2-" + hint);
      else if (hint === "caption") t.classList.add("a2-caption");
      t.textContent = boundStr(props.text);
      return t;
    }
    case "Divider":
      return el("hr", "a2divider");
    case "Image": {
      const src = boundStr(props.url || props.src);
      if (!/^https?:\/\//i.test(src)) return null;
      const img = el("img", "a2img"); img.src = src; img.alt = boundStr(props.alt) || ""; return img;
    }
    case "Icon": {
      const s = el("span", "material-symbols-outlined"); s.textContent = iconName(boundStr(props.name) || props.name); return s;
    }
    default:
      return null;
  }
}

function renderSurface(messages, container) {
  const comps = {};
  const roots = [];
  for (const m of messages) {
    if (m.beginRendering && typeof m.beginRendering.root === "string") roots.push(m.beginRendering.root);
    const su = m.surfaceUpdate;
    if (su && Array.isArray(su.components)) for (const c of su.components) if (c && c.id && c.component) comps[c.id] = c.component;
  }
  let rootIds = roots.filter(r => comps[r]);
  if (rootIds.length === 0) {
    const referenced = new Set();
    for (const id in comps) { const spec = comps[id]; childIds(spec[Object.keys(spec)[0]] || {}).forEach(c => referenced.add(c)); }
    rootIds = Object.keys(comps).filter(id => !referenced.has(id));
  }
  let drew = false;
  for (const rid of rootIds) { const node = buildNode(rid, comps, new Set()); if (node) { container.appendChild(node); drew = true; } }
  return drew;
}

function flattenText(messages) {
  const out = [];
  for (const m of messages) {
    const su = m.surfaceUpdate;
    if (su && Array.isArray(su.components)) for (const c of su.components) if (c && c.component && c.component.Text) out.push(boundStr(c.component.Text.text));
  }
  return out.join("\n").trim();
}

function renderReply(b, parts) {
  b.textContent = "";
  const texts = parts.filter(p => p && (p.kind === "text" || (!p.kind && p.text))).map(p => p.text || "");
  const a2ui = parts.filter(p => p && p.kind === "a2ui" && p.data).map(p => p.data);

  const textStr = texts.join("\n").trim();
  if (textStr) b.appendChild(el("div", null, textStr));

  if (a2ui.length) {
    b.classList.add("rich");
    if (!renderSurface(a2ui, b)) b.appendChild(el("div", null, flattenText(a2ui) || "(no card content)"));
  }
  if (!b.childNodes.length) b.textContent = "(no response)";
  log.scrollTop = log.scrollHeight;
}

form.addEventListener("submit", async (ev) => {
  ev.preventDefault();
  const text = input.value.trim();
  if (!text) return;
  bubble("user").textContent = text;
  input.value = "";
  const b = bubble("agent"); b.textContent = "…";
  try {
    const res = await fetch("/chat", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ message: text }) });
    const raw = await res.text();
    let data;
    try { data = JSON.parse(raw); }
    catch { throw new Error(`Server returned non-JSON (HTTP ${res.status}). ${raw.slice(0, 300)}`); }
    renderReply(b, data.parts || []);
  } catch (e) {
    b.textContent = "Error: " + e.message;
  }
});

document.querySelectorAll(".chip").forEach(chip => {
  chip.addEventListener("click", () => {
    input.value = chip.dataset.prompt;
    form.requestSubmit();
  });
});
</script>
</body>
</html>
